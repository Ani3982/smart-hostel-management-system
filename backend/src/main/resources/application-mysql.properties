# MySQL Profile Configuration
# To use this profile, run:
# mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# Or set environment variable: SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Surajsonawane2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
