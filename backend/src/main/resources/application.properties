# Spring Boot Application Properties
# Online Hostel Management System - New Arts, Commerce and Science College, Ahilyanagar (Autonomous)

spring.application.name=hostel-management-backend
server.port=8080

# Profile configuration:
# Defaults to 'mysql' for full MySQL persistence with root / Surajsonawane2004.
# Can also run with H2 fallback by setting SPRING_PROFILES_ACTIVE=h2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Default Database: Persistent H2 (saved in backend/data/hosteldb)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hosteldb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=./uploads

# Logging
logging.level.com.hostelmanagement=INFO
logging.level.org.springframework.security=WARN
